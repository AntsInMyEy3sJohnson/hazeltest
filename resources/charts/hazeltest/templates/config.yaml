apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "hazeltest.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ template "hazeltest.name" . }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  custom-load-config.yaml: |-
{{ toYaml .Values.loadConfig | indent 4 }}
  custom-logging-config.yaml: |-
{{ toYaml .Values.loggingConfig | indent 4 }}